; OpenForesia — la boutique de l'auberge (« legacy ++ »)
;
; Une boutique dans l'auberge (quête 0, carte 82 « Le coffre ») : l'armoire, à gauche du coffre,
; vend les objets listés ici. Dans le jeu de 1998, rien ne s'achète : l'or que l'on
; ramasse ne sert à rien. Ce fichier est lu par le jeu, jamais écrit : vos modifications sont
; conservées, y compris quand vous réinstallez.
;
; Décisions (Vincent, 2026-09-27) :
;  - le joueur qui ouvre la boutique paie avec SA bourse et reçoit l'objet ;
;  - l'objet est remis comme par un coffre (la boîte « vous obtenez… », inventaire plein géré) ;
;  - pas de personnage : le point de vente est l'ARMOIRE de la carte 82 — on s'en approche et on
;    appuie sur le bouton d'action (la carte 82 ne charge aucun modèle de personnage) ;
;  - le catalogue et les prix viennent de ce fichier, et se retouchent à la main.
;
; Comment les prix ont été calculés (OpenForesia.Tools/generer-boutique.mjs) :
;   prix = or gagné par monstre dans la zone où l'objet apparaît en premier × (20 + puissance)
;   puissance = ATT + DEF + la moitié des bonus de caractéristiques
;   or par monstre = 1,5 pièce en moyenne × (rang des monstres de la zone + 9) / 10
; Un objet de la forêt coûte donc quelques dizaines à quelques centaines de pièces, un objet
; de la fin du jeu quelques milliers. La bourse d'un personnage plafonne à 99 999.
;
; Pour retirer un objet de la vente : mettre « ; » devant sa ligne. Pour changer un prix :
; changer le nombre. Le nom doit rester exactement celui du jeu.

[Boutique]
; oui = l'armoire de la carte 82 est une boutique ; non = jeu d'origine.
