; OpenForesia — la boutique de le Kobold, dans le hub de l'auberge (« legacy ++ », LP-010)
;
; Le Kobold vend les armures et les boucliers. On lui parle en se tenant devant lui, tourné vers
; lui, avec le bouton d'action. Il est là dès que le hub l'est : LegacyPlus.ini, [Auberge] Hub = oui.
; Ce fichier est lu par le jeu, jamais écrit : vos modifications sont conservées, y compris quand
; vous réinstallez. Le joueur qui achète paie avec SA bourse et reçoit l'objet, identifié.
;
; Le jeu relit la catégorie de chaque objet dans sa fiche : un objet d'une autre catégorie, listé
; ici, n'est pas proposé.
; Chaque joueur ne voit que ce que SA classe peut porter (la fiche dit quelles classes le peuvent).
;
; Comment les prix ont été calculés (OpenForesia.Tools/generer-boutique.mjs) :
;   or par monstre = 1,5 pièce en moyenne × (rang des monstres de la zone + 9) / 10
;   prix = or par monstre de la zone où l'objet apparaît en premier × (20 + ATT + DEF + bonus / 2)
; La bourse d'un personnage plafonne à 99 999.
;
; Pour retirer un objet de la vente : mettre « ; » devant sa ligne. Pour changer un prix :
; changer le nombre. Le nom doit rester exactement celui du jeu.

