; OpenForesia — la boutique de le Lutin, dans le hub de l'auberge (« legacy ++ », LP-010)
;
; Le Lutin vend les objets utilisables (potions, herbes, cristaux, balles…). On lui parle en se tenant devant lui, tourné vers
; lui, avec le bouton d'action. Le hub s'active dans LegacyPlus.ini ([Auberge] Hub = oui).
; Ce fichier est lu par le jeu, jamais écrit : vos modifications sont conservées, y compris quand
; vous réinstallez. Le joueur qui achète paie avec SA bourse et reçoit l'objet, identifié.
;
; Le jeu relit la catégorie de chaque objet dans sa fiche : un objet d'une autre catégorie, listé
; ici, n'est pas proposé.
; Chaque joueur ne voit que ce que SA classe peut utiliser (les herbes : le Chasseur seulement).
;
; Comment les prix ont été calculés (OpenForesia.Tools/generer-boutique.mjs) :
;   un barème par famille, reconnue dans la description de l'objet :
;     herbes du Chasseur : 20
;     soins : 60
;     objets de combat : 150
;     soins complets : 250
;     résurrection : 300
;     cristaux d'arme : 400
;     effets permanents : 1500
;   (les prix de l'ancienne boutique de l'armoire, s'il y en avait, sont repris)
; La bourse d'un personnage plafonne à 99 999.
;
; Pour retirer un objet de la vente : mettre « ; » devant sa ligne. Pour changer un prix :
; changer le nombre. Le nom doit rester exactement celui du jeu.

[Boutique]
; oui = le Lutin se tient dans le hub et vend ; non = pas de marchand.
Actif = non

