; OpenForesia — réglages d'affichage
;
; Le jeu lit ce fichier au démarrage et ne l'écrit jamais : vos modifications sont conservées,
; y compris quand vous réinstallez. Une valeur mal écrite est ignorée (la valeur par défaut
; s'applique). Supprimer une ligne revient à prendre sa valeur par défaut.
;
; La taille de l'image du jeu lui-même se règle dans le jeu (touches F11 et F12), pas ici.

[Affichage]
; moderne = image fine à la taille de la fenêtre, bords lissés, décor lissé si l'option
;           « Filter » du jeu est active ; textes et menus toujours nets.
; origine = l'image du jeu d'origine, pixels compris.
Rendu = moderne

; fenetre              = une fenêtre normale, avec son cadre, qu'on peut agrandir ;
; fenetre-sans-bordure = une fenêtre sans cadre, centrée ; avec Fenetre = auto, tout l'écran.
;                        La souris passe librement sur un second écran ;
; plein-ecran          = plein écran exclusif ; cliquer sur un autre écran le met de côté.
; Alt+Entrée passe du mode choisi au plein écran, et retour.
Mode = fenetre

; Taille de la fenêtre, par exemple 1280x960. auto = la plus grande qui tienne à l'écran
; (tout l'écran en fenetre-sans-bordure).
Fenetre = auto

; ajustee = l'image remplit la fenêtre au format 4:3, lissée ;
; entiere = agrandissement par un nombre entier : pixels tous de même taille, bandes noires plus larges.
MiseAEchelle = ajustee
