; OpenForesia — réglages d'affichage
;
; Le jeu lit ce fichier au démarrage et ne l'écrit jamais : vos modifications sont conservées,
; y compris quand vous réinstallez. Une valeur mal écrite est ignorée (la valeur par défaut
; s'applique). Supprimer une ligne revient à prendre sa valeur par défaut.
;
; Pour retrouver l'image du jeu de 1998 :
;   ResolutionInterne = 1
;   Anticrenelage     = 1
;   Filtrage3D        = proche

[Affichage]
; Finesse du rendu. auto = la taille de l'image à l'écran (le plus net) ;
; 1 = la résolution du jeu d'origine ; 2 à 8 = deux à huit fois plus fin.
ResolutionInterne = auto

; Lissage des bords des polygones : 1 (aucun), 2, 4 ou 8.
Anticrenelage = 4

; ajustee = l'image remplit l'écran au format 4:3, lissée ;
; entiere = agrandissement par un nombre entier : pixels tous de même taille, bandes noires plus larges.
MiseAEchelle = ajustee

[Textures]
; Lissage du décor, des personnages, des portraits et des fonds d'écran.
; jeu = comme le jeu d'origine (réglage « Filter » de OpenForesia.cfg ; les personnages restent nets) ;
; proche = jamais lissés ; bilineaire = toujours lissés.
Filtrage3D = jeu

; Lissage des textes, des icônes et des cadres : net (pixels nets) ou lisse.
FiltrageInterface = net
