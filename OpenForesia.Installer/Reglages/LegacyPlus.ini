; OpenForesia — tweaks de gameplay (« legacy ++ »)
;
; Ces réglages changent l'équilibre du jeu de 1998. À leur valeur par défaut, c'est le jeu
; d'origine, exactement. Le jeu lit ce fichier au démarrage et ne l'écrit jamais : vos
; modifications sont conservées, y compris quand vous réinstallez. Une valeur mal écrite est
; ignorée (la valeur par défaut s'applique).

[Difficulte]
; Points de vie des monstres, multipliés : de 0.1 à 10.
; 1 = jeu d'origine ; 2 = deux fois plus de PV ; 1.5 (ou 1,5) = une fois et demie.
PvMonstres = 1

; Dégâts que les monstres infligent au groupe, multipliés : de 0.1 à 10.
; 1 = jeu d'origine. Les dégâts du groupe, le poison et les pièges ne changent pas.
DegatsMonstres = 1
