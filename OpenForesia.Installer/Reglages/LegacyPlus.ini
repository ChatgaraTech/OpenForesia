; OpenForesia — tweaks de gameplay (« legacy ++ »)
;
; Ces réglages changent l'équilibre du jeu de 1998. À leur valeur par défaut, c'est le jeu
; d'origine, exactement. Le jeu lit ce fichier au démarrage et ne l'écrit jamais : vos
; modifications sont conservées, y compris quand vous réinstallez. Une valeur mal écrite est
; ignorée (la valeur par défaut s'applique).

[Difficulte]
; Points de vie des monstres, multipliés : de 0.1 à 10.
; 1 = jeu d'origine ; 2 = deux fois plus de PV ; 1.5 (ou 1,5) = une fois et demie.
PvMonstres = 1

; Dégâts que les monstres infligent au groupe, multipliés : de 0.1 à 10.
; 1 = jeu d'origine. Les dégâts du groupe, le poison et les pièges ne changent pas.
DegatsMonstres = 1

[Magie]
; Les sorts du groupe montent avec la puissance magique (MAG) du lanceur : de 0 à 5.
; 0 = jeu d'origine, où un petit sort comme la Balle de feu ne progresse presque pas.
; 1 = conseillé : le montant du sort est multiplié par 1 + MAG / 100 (à MAG 130, ×2,3).
; Les sorts lancés par les monstres ne changent pas.
ScalingMagique = 0

; Se déplacer en lançant un sort, en part de la vitesse de marche : de 0 à 1.
; 0 = jeu d'origine (le lanceur est cloué sur place) ; 0.5 = conseillé, à mi-vitesse.
; Le lanceur garde sa pose d'incantation pendant qu'il avance.
DeplacementEnIncantation = 0

[Combat]
; Un ennemi touché devient intouchable quelques instants (il clignote).
; oui = jeu d'origine : pendant ce temps, PERSONNE ne peut le toucher — à plusieurs joueurs,
;       la plupart des coups se perdent.
; non = seule la même attaque est refusée : les autres joueurs, flèches et sorts touchent, et
;       on enchaîne ses coups en mêlée ; une même attaque ne compte jamais deux fois.
;       Le clignotement et le recul restent.
InvulnerabiliteEnnemis = oui

[Butin]
; Les pièces et les cristaux d'expérience que lâchent les monstres.
; non = jeu d'origine : il faut marcher dessus avant qu'ils ne s'estompent.
; oui = ramassés tout seuls une fois posés au sol ; les pièces se partagent à tour de rôle entre
;       les joueurs debout, l'expérience entre tous comme d'habitude. Les coffres ne sont jamais concernés : ils s'ouvrent toujours à la main.
RamassageAuto = non

[Rencontres]
; Les rencontres aléatoires (pas les monstres placés, ni les boss, ni les scènes).
;
; Cadence, multipliée : de 0.1 à 10. 1 = jeu d'origine ; 2 = deux fois plus souvent.
Frequence = 1

; 0 = jeu d'origine : il faut tuer tous les monstres avant que la rencontre suivante n'arrive.
; De 1 à 12 : une nouvelle rencontre peut arriver en plein combat, tant qu'il y a moins de monstres
; que ce nombre. Au-delà de 12 monstres, le moteur de 1998 ne peut plus tout dessiner.
MonstresMax = 0

; Nombre de groupes de monstres par rencontre : de 1 (jeu d'origine) à 4 ; on s'arrête
; toujours à 12 monstres.
Formations = 1
